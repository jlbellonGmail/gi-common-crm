name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  circuit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests (pytest)
        run: pytest -v

      - name: Validar adaptadores agenticos
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/sync-agentic-adapters.ps1 -Check

      - name: Validar supply chain del circuito
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/validate-supply-chain.ps1

  # Stack de producto documentado en docs/tecnica/arquitectura-crm.md
  # (ADR-C02): paquete Python gi_crm, extras opcionales [http]/[postgres].
  # Ver docs/tecnica/ci-real-product-tests.md para el detalle de este job
  # y por que reemplaza al placeholder heredado del template (ver tambien
  # docs/tecnica/ci-wiring-product-tests.md, feature historica del
  # template que introdujo ese placeholder).
  product-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-crm-dev.txt

      - name: Instalar gi_crm con extras de test
        run: |
          pip install -e ".[http,postgres]"
          pip install -r requirements-crm-dev.txt

      - name: Tests de producto (pytest, Postgres de servicio)
        env:
          CRM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_test
        run: pytest -v tests_crm/

  # Gate obligatorio igual que circuit-tests y product-tests (ver AGENTS.md,
  # seccion "CI/CD"): corre tests/test_local_reconciler_scripts.py, que el
  # pytestmark del propio archivo salta en circuit-tests (ubuntu-latest)
  # porque ejercita Start-Process -WindowStyle Hidden de PowerShell 5.1
  # Desktop, especifico de Windows. Sin continue-on-error: si esta suite
  # falla, el job queda rojo y bloquea el merge.
  local-reconciler-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Instalar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests del reconciliador local (pytest, Windows)
        run: pytest -v tests/test_local_reconciler_scripts.py
