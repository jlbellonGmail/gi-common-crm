[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-common-crm"
version = "0.1.0"
description = "Tenant-aware common Leads (CRM) library for GI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
http = ["fastapi>=0.115", "pydantic>=2.9"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["gi_crm*"]
